<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'XCustomArabic';
      src: url('fonts/IBMPlexArabic-Text.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'XCustomArabic', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      width: 290px;
      background: #0f1419;
      color: #f7f9f9;
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2f3336;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      background: #1d9bf0;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }

    .option-row:hover {
      border-color: #536471;
    }

    .site-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .site-title {
      font-size: 14px;
      font-weight: 600;
      color: #e7e9ea;
    }

    .site-sub {
      font-size: 11px;
      color: #71767b;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3e4144;
      transition: 0.25s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00ba7c;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .footer {
      margin-top: 8px;
      font-size: 11px;
      color: #71767b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>تحسين الخط العربي</h1>
    <span class="badge">IBM Plex</span>
  </div>

  <div class="option-row">
    <div class="site-info">
      <span class="site-title">تويتر (X.com)</span>
      <span class="site-sub">تفعيل الخط العربي في X</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleTwitter" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <div class="site-info">
      <span class="site-title">فيسبوك (Facebook)</span>
      <span class="site-sub">تفعيل الخط العربي في فيسبوك</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleFacebook" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    يتم التفعيل أو الإيقاف فوراً بدون إعادة تحميل الصفحة ✨
  </div>

  <script src="popup.js"></script>
</body>
</html>
